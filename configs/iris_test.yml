run:
  name: iris_test
  logs_dir: logs
  checkpoints_dir: checkpoints

task:
  task_type: classification
  input_length: 1
  pred_length: 1
  d_in: 4
  d_out: 4
  metrics: [loss, accuracy]
  use_norm: false

data:
  tabular:
    path: "data/tabular/iris.csv"
    target_col: "target"
    train_ratio: 0.7
    val_ratio: 0.15
    batch_size: 16
    normalize: true

eval:
  training_steps: 5
  extra_training_steps: 20
  early_stopping: true
  early_stop_patience: 10
  early_stop_min_delta: 0.0
  early_stop_checks: 1
  optimizer: adamw
  optimizer_kwargs: {lr: 0.0001, weight_decay: 0.0003}
  device: auto
  gpu_ids: null

selection:
  mode: single
  objectives: ["loss"]

search_space:
  families: ["iT"]
  stage_tokenizers: ["var", "none"]
  stage_retokens: ["none"]
  var_encoder_types: ["linear"]
  var_conv_kernels: [3]
  var_fft_keep_ratios: [0.25]
  var_decomp_kernels: [3]
  cross_groups: [1]
  cross_patch_sizes: [4]
  cross_strides: [1]
  cross_encoder_types: ["linear"]
  cross_conv_kernels: [3]
  cross_pools: ["avg"]
  stage_count_range: [1, 1]
  depth_range: [2, 4]
  model_dim_range: [32, 64]
  num_heads_range: [4, 4]
  ff_mult_range: [4.0, 4.0]
  patch_sizes: [4]
  strides: [1]
  overlaps: [0.0]
  per_channel_options: [true]
  cross_fusions: ["add"]
  freq_types: ["none"]
  freq_keep_ratios: [0.5]
  decomp_modes: ["none"]
  decomp_kernel_sizes: [3]
  conv_kernel_sizes: [3]
  conv_dilations: [1]
  block_types: ["attn"]
  pos_encoding_options: ["none"]
  dropout_range: [0.0, 0.1]

evo:
  population_size: 4
  max_evals: 3
  init_seed_fraction: 0.0
  mutation_rate: 0.3
  crossover_rate: 0.7
  steady_state: true
  tournament_size: 2
  use_weight_inheritance: true
  evals_per_generation: 2
  random_seed: 42
  num_workers: 1

constraints:
  min_blocks: 2
  max_blocks: 4
  max_conv_blocks: 4
  max_freq_blocks: 4
  max_cross_dim_blocks: 4
