run:
  name: ettm
  logs_dir: logs
  checkpoints_dir: checkpoints

task:
  task_type: forecasting
  input_length: 384
  pred_length: 192
  d_in: 7
  d_out: 7
  metrics: [mse, mae, params]
  use_norm: true

data:
  csv:
    paths: ["./data/ETT/ETTh1.csv"]
    feature_cols: ["HUFL","HULL","MUFL","MULL","LUFL","LULL","OT"]
    target_cols: ["HUFL","HULL","MUFL","MULL","LUFL","LULL","OT"]
    train_ratio: 0.7
    val_ratio: 0.1
    batch_size: 32
    num_workers: 0
    normalize: true
    file_format: "auto"         # "auto" | "csv" | "txt" | "npz"
    has_header: true           # if False, treat file as headerless
    delimiter: null   # for csv/txt (None => pandas default)
    npz_key: null     # which array key inside npz (None => first array found)
    # If True: interpret feature_cols/target_cols as integer indices (e.g. ["0","1","2"])
    # If False: interpret as column names (e.g. ["HUFL","HULL",...])
    use_col_indices: false
    # If file has a date column and you want marks, set date_col.
    # - header files: "date"
    # - headerless files: use_col_indices=True and date_col="0" (or set it to the index as string)
    date_col: null # e.g. "date" or "0" or null to disable
eval:
  training_steps: 20
  extra_training_steps: 2000
  early_stopping: true
  early_stop_patience: 10
  early_stop_min_delta: 0.0
  early_stop_checks: 1
  optimizer: adamw
  optimizer_kwargs:
    lr: 0.0001
    weight_decay: 0.0003
  device: auto
  gpu_ids: null # e.g., [0, 1, 2]; set to null to auto-select

selection:
  mode: single
  objectives: ["mse"]


search_space:
  families: ["iT", "PatchTST", "Crossformer", "Hybrid"] # options for model families -- So far: ["iT", "PatchTST", "Crossformer", "Hybrid"] -- TDOD: Add more families like Autoformer, Informer, etc.
  stage_tokenizers: ["time", "var", "patch", "cross"] # options for stage tokenization -- So far: ["time", "var", "patch", "cross"]
  stage_retokens: ["none", "cross_attn"] # options for retokenization at stage boundaries -- So far: ["none", "cross_attn"]
  stage_count_range: [1, 1]
  var_encoder_types: ["linear", "conv", "fft", "decomp_linear"]
  var_conv_kernels: [3, 5, 7] # convolution kernel sizes for variable-wise conv tokenization
  var_fft_keep_ratios: [0.125, 0.25, 0.5] # keep ratios for variable-wise FFT tokenization
  var_decomp_kernels: [3, 5, 7] # moving average kernel sizes for variable-wise decomposition tokenization
  cross_groups: [1, 2, 4] # group sizes for cross-variable tokenization
  cross_patch_sizes: [4, 8, 16] # patch sizes for cross-variable patch tokenization
  cross_strides: [1, 2, 4, 8] # strides for cross-variable patch tokenization
  cross_encoder_types: ["linear", "conv"] # options for cross-variable stage encoder types
  cross_conv_kernels: [3, 5] # convolution kernel sizes for cross-variable conv encoder
  cross_pools: ["avg", "max"] # pooling types for cross-variable conv encoder
  depth_range: [2, 24] # range for number of blocks (layers) per stage as [min, max]
  model_dim_range: [256, 512]
  num_heads_range: [4, 16] # range for number of attention heads as [min, max]
  ff_mult_range: [4.0, 4.0]
  patch_sizes: [4, 8] # patch sizes for patch-based blocks
  strides: [1, 2] # strides for patch-based blocks
  overlaps: [0.0] # overlap ratios for patch-based blocks
  per_channel_options: [true] # whether to use per-channel processing in patch-based blocks
  cross_groups: [1] # group sizes for cross-variable blocks
  cross_fusions: ["add"] # fusion methods for cross-variable blocks
  freq_types: ["none", "fft"] # options for frequency domain processing
  freq_keep_ratios: [0.5] # keep ratios for frequency domain processing
  decomp_modes: ["none", "moving_avg"] # options for time series decomposition
  decomp_kernel_sizes: [3, 5] # moving average kernel sizes for time series decomposition
  conv_kernel_sizes: [3] # convolution kernel sizes for conv-based blocks
  conv_dilations: [1] # convolution dilations for conv-based blocks
  block_types: ["attn", "inv_attn", "conv"] # options for block types -- So far: ["attn", "inv_attn", "conv"]
  pos_encoding_options: ["none", "absolute"] # options for positional encoding
  dropout_range: [0.0, 0.1] # range for dropout rate as [min, max]

evo:
  population_size: 20
  max_evals: 300
  init_seed_fraction: 0.5
  mutation_rate: 0.3
  crossover_rate: 0.7
  steady_state: true
  tournament_size: 2
  use_weight_inheritance: true
  evals_per_generation: 10
  random_seed: 42
  num_workers: 8
  

constraints:
  min_blocks: 4
  max_blocks: 8
  max_conv_blocks: 4
  max_freq_blocks: 4
  max_cross_dim_blocks: 4

seeds:
  - type: iTransformer
    model_dim: 256
    num_layers: 4
  # - type: iTransformer
  #   model_dim: 16
  #   num_layers: 2
  # - type: iTransformer
  #   model_dim: 64
  #   num_layers: 6
  # - type: iTransformer
  #   model_dim: 128
  #   num_layers: 16
  - type: PatchTST
    model_dim: 256
    num_layers: 4
