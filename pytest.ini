[pytest]
# Bare `pytest` must collect the real suite and nothing else.
#
# Without testpaths, collection walks the whole repo and imports anything matching
# test_*.py. scratch/test_qblock.py is a standalone script that calls sys.exit() at
# module level, so importing it aborts the run with
#   INTERNALERROR> SystemExit: 0 ... no tests collected
# and the entire suite silently fails to run rather than failing loudly.
testpaths = tests

# Belt and braces: testpaths only applies when no path argument is given, so an
# explicit `pytest .` would still walk scratch/ and the virtualenvs. The `.*` entry
# preserves pytest's default of skipping dot-directories, which this list replaces.
norecursedirs = scratch .* build dist *.egg node_modules __pycache__ logs checkpoints
